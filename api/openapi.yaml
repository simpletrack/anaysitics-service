openapi: 3.0.3
info:
  title: SimpleTrack Analytics Service API
  version: 0.1.0
  description: HTTP API for event collection, tracker delivery, health checks, and internal readback.
paths:
  /healthz:
    get:
      summary: Check service health.
      responses:
        "200":
          description: The service process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /tracker.js:
    get:
      summary: Return the browser tracker script.
      responses:
        "200":
          description: Tracker JavaScript asset.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/javascript:
              schema:
                type: string
        "404":
          description: Tracker script is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /collect:
    options:
      summary: CORS preflight for event collection.
      responses:
        "204":
          description: Preflight accepted by Fiber CORS middleware.
    post:
      summary: Accept one analytics event.
      parameters:
        - in: header
          name: X-SimpleTrack-Write-Key
          schema:
            type: string
          required: false
        - in: header
          name: Authorization
          schema:
            type: string
          required: false
          description: Bearer write key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectRequest"
      responses:
        "202":
          description: Event accepted or intentionally filtered before publish.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          description: Invalid JSON or validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid write key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Source disabled or origin not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal collect failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/realtime:
    get:
      summary: Read recent accepted events for one source.
      parameters:
        - $ref: "#/components/parameters/WriteKey"
        - $ref: "#/components/parameters/QueryAuthorization"
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Recent events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeResponse"
        "400":
          description: Invalid query parameter or missing write key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, expired, not-yet-valid, or unknown query token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin is not allowed, query token scope does not allow Realtime, or source readback policy disables Realtime.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query API is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/events:
    get:
      summary: List accepted events for one source and time range.
      parameters:
        - $ref: "#/components/parameters/WriteKey"
        - $ref: "#/components/parameters/QueryAuthorization"
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: event_name
          schema:
            type: string
        - in: query
          name: distinct_id
          schema:
            type: string
        - in: query
          name: visit_id
          schema:
            type: string
        - in: query
          name: sort_field
          schema:
            type: string
            enum: [event_time, received_at, event_name]
        - in: query
          name: sort_direction
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: property_filter
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Repeatable URL-encoded JSON filter payloads.
      responses:
        "200":
          description: Event list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "400":
          description: Invalid query parameter, filter, or missing write key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, expired, not-yet-valid, or unknown query token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin is not allowed, query token scope does not allow Events, or source readback policy disables Events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query API is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/goals:
    get:
      summary: Count events matching one P1 Goal rule for one source and time range.
      parameters:
        - $ref: "#/components/parameters/WriteKey"
        - $ref: "#/components/parameters/QueryAuthorization"
        - in: query
          name: event_name
          required: true
          schema:
            type: string
          description: Event name used by the minimal Goal rule.
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Goal event count summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "400":
          description: Invalid query parameter, missing event name, or missing write key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, expired, not-yet-valid, or unknown query token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin is not allowed, query token scope does not allow Goals, or source readback policy disables Goals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Query API is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/properties:
    get:
      summary: List observed property definitions for one source.
      parameters:
        - $ref: "#/components/parameters/WriteKey"
        - $ref: "#/components/parameters/QueryAuthorization"
        - in: query
          name: scope
          schema:
            type: string
            enum: [event, user]
          description: Optional property scope filter.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Source-scoped property catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyCatalogResponse"
        "400":
          description: Invalid query parameter or missing write key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, expired, not-yet-valid, or unknown query token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin is not allowed, query token scope does not allow Properties, or source readback policy disables Properties.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Property catalog API is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/kafka/diagnostics:
    get:
      summary: Read process-local Kafka EventBus diagnostics.
      description: Internal operator endpoint. The response is a process-local diagnostic snapshot and does not include broker credentials, raw event payloads, or authoritative broker lag.
      parameters:
        - $ref: "#/components/parameters/QueryAuthorization"
      responses:
        "200":
          description: Kafka EventBus diagnostic snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KafkaDiagnosticsResponse"
        "401":
          description: Missing, expired, not-yet-valid, or unknown query token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Query token scope does not allow Kafka diagnostics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Kafka diagnostics are not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/kafka/metrics:
    get:
      summary: Scrape process-local Kafka EventBus metrics.
      description: Internal operator endpoint. The response is Prometheus text metrics derived from KafkaDiagnosticsResponse and does not include broker credentials, raw event payloads, or authoritative broker lag.
      parameters:
        - $ref: "#/components/parameters/QueryAuthorization"
      responses:
        "200":
          description: Prometheus text metrics derived from KafkaDiagnosticsResponse.
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP simpletrack_kafka_consumed_total Kafka records consumed from the primary analytics topic.
                # TYPE simpletrack_kafka_consumed_total counter
                simpletrack_kafka_consumed_total 40
                # HELP simpletrack_kafka_ordered_commit_lag_estimate Kafka process-local lag estimate by topic-partition; not authoritative broker lag.
                # TYPE simpletrack_kafka_ordered_commit_lag_estimate gauge
                simpletrack_kafka_ordered_commit_lag_estimate{topic="analytics.events",partition="2"} 7
        "401":
          description: Missing, expired, not-yet-valid, or unknown query token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Query token scope does not allow Kafka metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Kafka metrics are not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    WriteKey:
      in: query
      name: write_key
      required: true
      schema:
        type: string
    QueryAuthorization:
      in: header
      name: Authorization
      required: true
      schema:
        type: string
      description: Bearer query token.
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AcceptedResponse:
      type: object
      required: [id, received_at]
      properties:
        id:
          type: string
        received_at:
          type: string
          format: date-time
        filtered:
          type: boolean
    CollectRequest:
      type: object
      required: [event_name, distinct_id]
      properties:
        write_key:
          type: string
        id:
          type: string
        event_name:
          type: string
        distinct_id:
          type: string
        session_id:
          type: string
        visit_id:
          type: string
        event_time:
          type: string
          format: date-time
        properties:
          type: object
          additionalProperties: true
        user_properties:
          type: object
          additionalProperties: true
    SourceResponse:
      type: object
      required: [tenant_id, project_id, source_id, source_type]
      properties:
        tenant_id:
          type: string
        project_id:
          type: string
        source_id:
          type: string
        source_type:
          type: string
    EventItem:
      type: object
      required: [id, tenant_id, project_id, source_id, source_type, event_name, distinct_id, event_time, received_at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        project_id:
          type: string
        source_id:
          type: string
        source_type:
          type: string
        event_name:
          type: string
        distinct_id:
          type: string
        session_id:
          type: string
        visit_id:
          type: string
        event_time:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        properties:
          type: object
          additionalProperties: true
        user_properties:
          type: object
          additionalProperties: true
        source:
          type: string
    RealtimeResponse:
      type: object
      required: [source, items, since, limit]
      properties:
        source:
          $ref: "#/components/schemas/SourceResponse"
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventItem"
        since:
          type: string
          format: date-time
        limit:
          type: integer
        query_evidence:
          $ref: "#/components/schemas/QueryEvidence"
    EventsResponse:
      type: object
      required: [source, items, limit, offset, from, to]
      properties:
        source:
          $ref: "#/components/schemas/SourceResponse"
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventItem"
        limit:
          type: integer
        offset:
          type: integer
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        query_evidence:
          $ref: "#/components/schemas/QueryEvidence"
    GoalResponse:
      type: object
      required: [source, event_name, from, to, matching_events, has_data]
      properties:
        source:
          $ref: "#/components/schemas/SourceResponse"
        event_name:
          type: string
          description: Event name used by the minimal Goal rule.
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        matching_events:
          type: integer
          format: int64
          description: Exact event count returned by analytics-core.
        has_data:
          type: boolean
          description: True when at least one matching event exists.
        query_evidence:
          $ref: "#/components/schemas/QueryEvidence"
    PropertyCatalogItem:
      type: object
      required: [scope, name, value_type, first_seen_at, last_seen_at]
      properties:
        scope:
          type: string
          enum: [event, user]
        name:
          type: string
        value_type:
          type: string
          enum: [null, string, number, bool]
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
    PropertyCatalogResponse:
      type: object
      required: [source, items, limit]
      properties:
        source:
          $ref: "#/components/schemas/SourceResponse"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PropertyCatalogItem"
        limit:
          type: integer
    KafkaWorkerPoolDiagnostics:
      type: object
      required: [name, goroutines_total, queued, queue_capacity, queue_usage_ratio, workers, submitted_total, completed_total, rejected_total, closed]
      properties:
        name:
          type: string
        goroutines_total:
          type: integer
          description: Runtime goroutine count at sampling time.
        queued:
          type: integer
          format: int64
        queue_capacity:
          type: integer
        queue_usage_ratio:
          type: number
          format: double
        workers:
          type: integer
        submitted_total:
          type: integer
          format: int64
        completed_total:
          type: integer
          format: int64
        rejected_total:
          type: integer
          format: int64
        closed:
          type: boolean
    KafkaCompletionGateDiagnostics:
      type: object
      required: [in_flight_messages, waiting_tasks, completed_messages]
      properties:
        in_flight_messages:
          type: integer
          format: int64
        waiting_tasks:
          type: integer
          format: int64
        completed_messages:
          type: integer
          format: int64
    KafkaOrderedCommitDiagnostics:
      type: object
      required: [topic, partition, initialized, next_offset, high_water_mark_offset, lag_estimate, pending_count, done_count, oldest_pending_offset, largest_pending_gap]
      properties:
        topic:
          type: string
        partition:
          type: integer
          format: int32
        initialized:
          type: boolean
        next_offset:
          type: integer
          format: int64
          description: Earliest offset still blocking ordered completion.
        high_water_mark_offset:
          type: integer
          format: int64
          description: Latest claim high-water mark observed by this process.
        lag_estimate:
          type: integer
          format: int64
          description: process-local estimate, not authoritative broker lag.
        pending_count:
          type: integer
        done_count:
          type: integer
        oldest_pending_offset:
          type: integer
          format: int64
        largest_pending_gap:
          type: integer
          format: int64
    KafkaMetricsDiagnostics:
      type: object
      required: [consumed_total, handler_success_total, handler_failure_total, handler_retry_total, malformed_total, dead_letter_success_total, dead_letter_failure_total, paused_partitions, pause_transitions_total, resume_transitions_total]
      properties:
        consumed_total:
          type: integer
          format: int64
        handler_success_total:
          type: integer
          format: int64
        handler_failure_total:
          type: integer
          format: int64
        handler_retry_total:
          type: integer
          format: int64
        malformed_total:
          type: integer
          format: int64
        dead_letter_success_total:
          type: integer
          format: int64
        dead_letter_failure_total:
          type: integer
          format: int64
        paused_partitions:
          type: integer
          format: int64
        pause_transitions_total:
          type: integer
          format: int64
        resume_transitions_total:
          type: integer
          format: int64
    KafkaDiagnosticsResponse:
      type: object
      required: [topic, dead_letter_topic, worker_pool, completion_gate, commits, metrics]
      properties:
        topic:
          type: string
        dead_letter_topic:
          type: string
        worker_pool:
          $ref: "#/components/schemas/KafkaWorkerPoolDiagnostics"
        completion_gate:
          $ref: "#/components/schemas/KafkaCompletionGateDiagnostics"
        commits:
          type: array
          items:
            $ref: "#/components/schemas/KafkaOrderedCommitDiagnostics"
        paused:
          type: object
          description: Topic-to-partition list currently paused by local backpressure.
          additionalProperties:
            type: array
            items:
              type: integer
              format: int32
        metrics:
          $ref: "#/components/schemas/KafkaMetricsDiagnostics"
    QueryEvidence:
      type: object
      required:
        - family
        - read_path
        - optimization
        - effective_limit
        - offset
        - has_time_lower_bound
        - has_time_upper_bound
        - time_window_seconds
        - scalar_filter_count
        - property_filter_count
        - uses_property_table
        - sort_direction
        - observed_rows
        - pressure
      properties:
        family:
          type: string
          enum: [events, realtime, goal]
        read_path:
          type: string
          example: fact_events
        optimization:
          type: string
          example: direct_fact_table
        effective_limit:
          type: integer
          description: Builder-capped row limit used by analytics-core.
        offset:
          type: integer
          description: Events pagination offset after validation. Realtime and Goal count reports 0.
        has_time_lower_bound:
          type: boolean
          description: Whether the query constrains the start time.
        has_time_upper_bound:
          type: boolean
          description: Whether the query constrains the end time.
        time_window_seconds:
          type: integer
          format: int64
          description: Bounded from/to window in seconds when both edges are present; 0 for open-ended Realtime.
        scalar_filter_count:
          type: integer
        property_filter_count:
          type: integer
        uses_property_table:
          type: boolean
        property_filters:
          type: array
          description: Typed property predicate shapes included in the query evidence. Values are intentionally omitted.
          items:
            type: object
            required: [scope, name, value_type, operator]
            properties:
              scope:
                type: string
                enum: [event, user]
              name:
                type: string
              value_type:
                type: string
                enum: [null, string, number, bool]
              operator:
                type: string
                enum: [eq, neq]
        sort_field:
          type: string
          enum: [event_time, received_at, event_name]
        sort_direction:
          type: string
          enum: [asc, desc]
        observed_rows:
          type: integer
          format: int64
          description: Result cardinality observed by this readback execution. This is not a scanned-row estimate and does not drive the pressure bucket.
        pressure:
          type: string
          enum: [low, medium, high]
          description: Coarse read-side triage bucket derived from query evidence, not an SLA or autoscaling signal
