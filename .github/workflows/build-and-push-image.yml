name: Build and Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: simpletrack

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: analytics-service

      - uses: actions/checkout@v4
        with:
          repository: simpletrack/analytics-core
          ref: main
          path: analytics-core
          token: ${{ secrets.ANALYTICS_CORE_CHECKOUT_TOKEN }}

      - name: Resolve image owner
        id: image_owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./analytics-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ steps.image_owner.outputs.owner }}/${{ env.IMAGE_NAMESPACE }}/analytics-service:latest
            ${{ env.IMAGE_REGISTRY }}/${{ steps.image_owner.outputs.owner }}/${{ env.IMAGE_NAMESPACE }}/analytics-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
