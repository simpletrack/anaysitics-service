name: Build and Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io
  GIT_PROTOCOL: https

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile
          sparse-checkout-cone-mode: false

      - name: Resolve image owner
        id: image_owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ steps.image_owner.outputs.owner }}/analytics-service:latest
            ${{ env.IMAGE_REGISTRY }}/${{ steps.image_owner.outputs.owner }}/analytics-service:${{ github.sha }}
          build-args: |
            GIT_PROTOCOL=${{ env.GIT_PROTOCOL }}
            GIT_CLONE_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GIT_CLONE_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
